name: Jet Com
description: Jet.com was an American e-commerce marketplace founded in 2014 by Marc Lore that used
  dynamic, real-time pricing to lower cart totals as shoppers combined orders. Walmart acquired Jet.com
  in 2016 for approximately 3.3 billion dollars, folded its technology and talent into Walmart's online
  operation, and fully shut down the Jet.com brand and site in 2020. The jet.com domain now redirects to
  walmart.com, and no Jet-branded developer portal, documentation, SDKs, or API surface remain online.
